[package]
name = "codeverse"
version = "0.3.0"
description = "CODEVERSE desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "codeverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size-focused release profile (smaller installer, lower memory).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
